name: Release

# Manuell starten (Actions → Release → Run workflow). Baut das portable Paket aus
# main, prüft es mit demselben Ablauf wie die CI und veröffentlicht das GitHub-Release
# v<Version aus Cargo.toml> mit ZIP und SHA256-Datei. Titel und Text stammen aus
# RELEASE_NOTES.md (erste Zeile = Titel).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read version and release notes
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw -Encoding utf8
          $version = [regex]::Match($manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version: '$version'" }
          $tag = "v$version"
          $lines = Get-Content -LiteralPath RELEASE_NOTES.md -Encoding utf8
          if ($lines[0] -notmatch '^# (.+)$') { throw 'RELEASE_NOTES.md must start with "# <title>"' }
          $title = $Matches[1].Trim()
          if (-not $title.Contains($version)) { throw "Release notes title '$title' does not mention $version" }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ($lines | Select-Object -Skip 1) -join "`n" | ForEach-Object { $_.TrimStart("`n") } |
            Set-Content -LiteralPath $notes -Encoding utf8NoBOM
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists" }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "title=$title`n", [Text.UTF8Encoding]::new($false))
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup override set 1.89.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }
      - name: Format, tests, release build and PTY tests
        run: ./scripts/ci.ps1
      - name: Build portable package
        id: package
        run: |
          $zip = ./scripts/package.ps1 -SkipBuild | Select-Object -Last 1
          if (-not (Test-Path -LiteralPath $zip) -or -not (Test-Path -LiteralPath "$zip.sha256")) { throw 'Package missing' }
          $expected = "TerminalVelocity-${{ steps.meta.outputs.version }}-Windows-x64.zip"
          if ((Split-Path -Leaf $zip) -ne $expected) { throw "Unexpected package name: $zip" }
          Get-Content -LiteralPath "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          NOTES: ${{ steps.meta.outputs.notes }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          & gh release create $env:TAG $env:ZIP "$($env:ZIP).sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:TITLE `
            --notes-file $env:NOTES
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
