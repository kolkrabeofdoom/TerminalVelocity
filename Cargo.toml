[package]
name = "terminalvelocity"
version = "0.9.2"
edition = "2021"
license = "MIT"
description = "Portable Windows terminal prototype"

[[bin]]
name = "TerminalVelocity"
path = "src/main.rs"

[features]
test-tools = []

[[bin]]
name = "prompt-probe"
path = "tools/prompt_probe.rs"
required-features = ["test-tools"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui_term = { path = "vendor/egui_term-0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 2
strip = true

[dev-dependencies]
egui = "=0.31.1"
alacritty_terminal = "=0.25.1"

[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal-0.25.1" }
vte = { path = "vendor/vte-0.15.0" }
