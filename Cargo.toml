[package]
name = "rust-terminal"
version = "0.1.7"
edition = "2021"
license = "MIT"
description = "Portable Windows terminal prototype"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui_term = { path = "vendor/egui_term-0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 2
strip = true


