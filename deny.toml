# cargo-deny: security advisories and licenses of all dependencies in Cargo.lock.
# Run locally with `cargo deny check advisories licenses`; CI: .github/workflows/audit.yml.

[graph]
# TerminalVelocity only ships for Windows x64; ignore Unix-only dependencies.
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
# Vulnerability and unsoundness advisories always fail the check.
yanked = "deny"
# Unmaintained transitive crates (e.g. ttf-parser via egui) are reported but only
# direct dependencies fail; those are replaced with the next egui upgrade.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    # Fonts embedded by egui (epaint_default_fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
